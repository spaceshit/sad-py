name: Extended reliability
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=sad --cov-branch --cov-report=json:artifacts/coverage.json --junitxml=artifacts/tests.xml
      - run: python scripts/reliability_report.py
      - run: python scripts/benchmark.py --operations 10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-reliability
          path: artifacts/
